<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14101c"><title>Karaoke Studio v2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#392653 0,#14101c 65%);font-family:system-ui,Arial,sans-serif;color:#f8f5ff}main{max-width:1000px;margin:auto;padding:25px 19px 70px}h1{font-size:clamp(36px,6vw,62px);line-height:1.08;margin:43px 0 14px}h1 span{color:#b093ff}h2{font-size:21px;margin:5px 0 16px}p{color:#bfb3d0;line-height:1.6}.brand{font-weight:800;font-size:22px}.brand em{background:#865ce7;border-radius:12px;padding:9px;margin-right:7px;font-style:normal}.grid{display:grid;grid-template-columns:1fr 1.18fr;gap:18px}.panel{background:#261e32;border:1px solid #514066;border-radius:20px;padding:23px;margin:12px 0}.eyebrow{font-size:11px;color:#c1b0d9;letter-spacing:.17em;font-weight:800}.pair{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.qr{background:#fff;border-radius:12px;padding:10px;width:182px;height:182px}.qr img,.qr canvas{display:block;width:162px!important;height:162px!important}.pair article{flex:1;min-width:130px}.pill{font-size:12px;color:#e0d1ff;background:#43335a;border-radius:24px;padding:7px 11px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.status{margin:15px 0;background:#3b304d;border-radius:10px;padding:13px;font-size:13px;line-height:1.5}.status.error{background:#512738;color:#ffcbd6}.status.good{background:#24493e;color:#b9f7df}button{cursor:pointer;background:#8b60ef;border:0;border-radius:11px;padding:12px 15px;color:white;font-weight:700;font:inherit}button.secondary{background:#463956}button:disabled{opacity:.45;cursor:default}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.presets{display:flex;gap:8px;flex-wrap:wrap}.presets button{font-size:12px;background:#423551}.presets button.active{background:#8b60ef}.sliders{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}.control{margin-top:18px}.control label{display:flex;justify-content:space-between;font-size:14px;font-weight:600}.control label b{color:#c7b2ff}input[type=range]{width:100%;accent-color:#ad8aff;margin-top:9px}.meter{height:10px;background:#42374f;border-radius:20px;overflow:hidden}.meter div{width:0;height:100%;background:linear-gradient(90deg,#8163e6,#eaa2d2)}.tiny{font-size:12px;color:#aaa0bb}.diag{font-size:12px;line-height:1.5;overflow-wrap:anywhere;color:#bbafd0;margin:12px 0}.hidden{display:none}.incoming{padding:13px;background:#483161;border:1px solid #9e82fa;border-radius:10px;margin-top:14px}.phone{max-width:485px}.phoneTop{text-align:center;padding:65px 6px 23px}.orb{display:grid;place-items:center;font-size:68px;width:150px;height:150px;border-radius:50%;margin:auto;background:linear-gradient(135deg,#ac85ff,#5a399a)}input[type=text],select{width:100%;border:1px solid #67547c;border-radius:11px;background:#1a1525;color:white;padding:13px;margin-top:12px}.wide{width:100%;margin-top:10px}.music{margin-top:14px}.music a{color:#d6baff}@media(max-width:720px){.grid{grid-template-columns:1fr}.panel{padding:18px}.sliders{gap:4px 13px}}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),query=new URLSearchParams(location.search),isPhone=query.get('mode')==='mic';
const defaults={volume:70,bass:50,treble:50,reverb:0,echo:0};
const profiles={Dry:{volume:70,bass:50,treble:50,reverb:0,echo:0},Studio:{volume:72,bass:50,treble:53,reverb:25,echo:8},Concert:{volume:70,bass:53,treble:53,reverb:55,echo:22}};
let peer=null,call=null,pending=null,localStream=null,audio=null,remoteTrack=null,phoneMeter=null,phoneFrame=0,meterFrame=0,statsTimer=null,muted=false,lowLatency=true,deviceId='default',requestedRoom='',acceptToken=0,standbyCtx=null,phoneStatsTimer=null,toneCtx=null,toneOsc=null,toneTrack=null,toneActive=false;
function message(s,type=''){const x=$('status');if(x){x.textContent=s;x.className='status '+type}}
function fail(e){message(e?.message||String(e),'error')}
function randomRoom(){return 'ks-'+[...crypto.getRandomValues(new Uint8Array(12))].map(v=>v.toString(16).padStart(2,'0')).join('')}
function stopPhone(){if(toneOsc){try{toneOsc.stop()}catch{}toneOsc=null}if(toneTrack){toneTrack.stop();toneTrack=null}if(toneCtx){toneCtx.close().catch(()=>{});toneCtx=null}toneActive=false;if(phoneStatsTimer){clearInterval(phoneStatsTimer);phoneStatsTimer=null}cancelAnimationFrame(phoneFrame);if(phoneMeter){phoneMeter.close().catch(()=>{});phoneMeter=null}const old=call;call=null;if(old)old.close();localStream?.getTracks().forEach(t=>t.stop());localStream=null;if(peer){peer.destroy();peer=null}if($('start'))$('start').disabled=false;if($('stop'))$('stop').disabled=true;if($('testTone')){$('testTone').disabled=true;$('testTone').textContent='Send test tone'}}
async function closeAudio(){cancelAnimationFrame(meterFrame);if(audio){const old=audio;audio=null;await old.ctx.close().catch(()=>{})}if($('bar'))$('bar').style.width='0%'}
function stopCall(){++acceptToken;const old=call;call=null;if(old)old.close();if(standbyCtx){standbyCtx.close().catch(()=>{});standbyCtx=null}clearInterval(statsTimer);statsTimer=null;remoteTrack=null;closeAudio();if($('connected'))$('connected').textContent='WAITING FOR MIC';if($('disconnect'))$('disconnect').disabled=true}
function measure(analyser,ctx,kind){const bytes=new Uint8Array(analyser.fftSize);function loop(){if(kind==='phone'?(phoneMeter!==ctx):(audio?.ctx!==ctx))return;analyser.getByteTimeDomainData(bytes);let sum=0;for(let i=0;i<bytes.length;i++){const v=(bytes[i]-128)/128;sum+=v*v}const n=Math.min(100,Math.round(Math.sqrt(sum/bytes.length)*380));if($('bar'))$('bar').style.width=n+'%';if($('meterVal'))$('meterVal').textContent=n+'%';if(kind==='phone')phoneFrame=requestAnimationFrame(loop);else meterFrame=requestAnimationFrame(loop)}loop()}
async function startAudio(media,token){
 await closeAudio();if(token!==acceptToken)return;
 const ctx=standbyCtx||new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});standbyCtx=null;
 const source=ctx.createMediaStreamSource(media),input=ctx.createGain(),low=ctx.createBiquadFilter(),high=ctx.createBiquadFilter(),analyser=ctx.createAnalyser(),dry=ctx.createGain(),wet=ctx.createGain(),echoWet=ctx.createGain(),verb=ctx.createConvolver(),delay=ctx.createDelay(0.8),feedback=ctx.createGain(),sum=ctx.createGain(),limiter=ctx.createDynamicsCompressor();
 low.type='lowshelf';low.frequency.value=230;high.type='highshelf';high.frequency.value=3000;analyser.fftSize=1024;delay.delayTime.value=.19;feedback.gain.value=.17;limiter.threshold.value=-9;limiter.ratio.value=10;limiter.attack.value=.003;limiter.release.value=.1;
 const len=Math.floor(ctx.sampleRate*1.8),buffer=ctx.createBuffer(2,len,ctx.sampleRate);
 for(let ch=0;ch<2;ch++){const a=buffer.getChannelData(ch);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}verb.buffer=buffer;
 // Always keep a zero-delay dry path. Effects run in PARALLEL, never in series with the dry path.
 source.connect(input).connect(low).connect(high).connect(analyser);
 analyser.connect(dry).connect(sum);analyser.connect(verb).connect(wet).connect(sum);
 analyser.connect(delay).connect(echoWet).connect(sum);delay.connect(feedback).connect(delay);
 sum.connect(limiter).connect(ctx.destination);
 audio={ctx,input,low,high,dry,wet,echoWet,update(){
 const n=k=>Number($(k).value),t=ctx.currentTime;
 input.gain.setTargetAtTime(Math.pow(n('volume')/70,1.25),t,.015);
 low.gain.setTargetAtTime((n('bass')-50)*.16,t,.015);
 high.gain.setTargetAtTime((n('treble')-50)*.16,t,.015);
 dry.gain.setTargetAtTime(muted?0:1,t,.015);
 wet.gain.setTargetAtTime(muted||lowLatency?0:n('reverb')*.008,t,.015);
 echoWet.gain.setTargetAtTime(muted||lowLatency?0:n('echo')*.006,t,.015);
 }};
 audio.update();measure(analyser,ctx,'laptop');
 try{if(deviceId!=='default'&&typeof ctx.setSinkId==='function')await ctx.setSinkId(deviceId);await ctx.resume()}catch(e){fail(e)}
 if(token!==acceptToken){await closeAudio();return}
 message(ctx.state==='running'?'Live audio engine running. Start with DRY voice.':'Audio engine suspended. Click Resume audio.','good');
}
function watch(c){
 clearInterval(statsTimer);let lastPackets=null,lastEnergy=null,lastDuration=null;const inspect=async()=>{
 if(call!==c)return;const pc=c.peerConnection;let packets=null,signal=null,energy=null,duration=null;
 try{const reports=await pc.getStats();reports.forEach(s=>{if(s.type==='inbound-rtp'&&(s.kind==='audio'||s.mediaType==='audio')&&!s.isRemote){packets=s.packetsReceived??null;signal=s.audioLevel??null;energy=s.totalAudioEnergy??null;duration=s.totalSamplesDuration??null}})}catch{}
 const delta=energy!==null&&lastEnergy!==null&&duration!==null&&lastDuration!==null&&duration>lastDuration?Math.sqrt(Math.max(0,(energy-lastEnergy)/(duration-lastDuration))):null;lastEnergy=energy;lastDuration=duration;const ice=pc?.iceConnectionState||'unknown';
 if($('diagnostic'))$('diagnostic').textContent='ICE '+ice+' · Packets '+(packets??'?')+' · Signal '+(delta!==null?(delta*100).toFixed(1)+'% RMS':signal===null?'?':(signal*100).toFixed(1)+'%')+' · Audio '+(audio?.ctx.state||'not started')+' · Output '+deviceId;
 if(ice==='failed')message('WebRTC transport failed; try same Wi-Fi or another network.','error');
 if(packets!==null&&lastPackets===packets&&ice==='connected')message('Audio packets stopped arriving.','error');
 lastPackets=packets;
 };inspect();statsTimer=setInterval(inspect,2500);
}
async function outputs(){
 const sel=$('output');if(!sel)return;sel.innerHTML='<option value="default">System default (recommended)</option>';
 if(!navigator.mediaDevices?.enumerateDevices)return;
 try{const d=await navigator.mediaDevices.enumerateDevices();for(const item of d){if(item.kind!=='audiooutput'||!item.deviceId||item.deviceId==='default')continue;const opt=document.createElement('option');opt.value=item.deviceId;opt.textContent=item.label||'Audio output '+sel.length;sel.appendChild(opt)}sel.value=[...sel.options].some(o=>o.value===deviceId)?deviceId:'default';deviceId=sel.value}catch(e){fail(e)}
}
function desktop(){
 const room=randomRoom(),link=new URL(location.href);link.search=new URLSearchParams({mode:'mic',room});link.hash='';
 const fields=Object.entries(defaults).map(([k,v])=>'<div class="control"><label>'+({volume:'Mic Volume',bass:'Bass',treble:'Treble',reverb:'Reverb',echo:'Echo'}[k])+'<b id="'+k+'Val">'+v+'%</b></label><input id="'+k+'" type="range" min="0" max="100" value="'+v+'"></div>').join('');
 $('app').innerHTML='<main><div class="brand"><em>♫</em>Karaoke Studio <small>v2</small></div><h1>Wireless microphone.<br><span>Real-time voice.</span></h1><p>iPhone as microphone · Laptop as mixer · YouTube in another tab.</p><div class="grid"><section class="panel"><div class="head"><div><div class="eyebrow">01 / CONNECT</div><h2>iPhone microphone</h2></div><b class="pill" id="connected">WAITING FOR MIC</b></div><div class="pair"><div id="qr" class="qr"></div><article><b>Scan from iPhone</b><p>Start mic, then Accept on laptop.</p><div class="tiny">Room: '+room+'</div><div class="buttons"><button id="copy" class="secondary">Copy phone link</button></div></article></div><div id="incoming" class="incoming hidden"><b>Phone wants to connect</b><div class="buttons"><button id="accept">Accept mic</button><button id="reject" class="secondary">Reject</button></div></div><div id="status" class="status">Connecting to pairing service…</div><div id="diagnostic" class="diag">Waiting for audio</div><label class="tiny" for="output">Audio output</label><select id="output"><option value="default">System default (recommended)</option></select><div class="buttons"><button id="refresh" class="secondary">Refresh outputs</button><button id="resume">Resume audio</button><button id="disconnect" class="secondary" disabled>Disconnect</button></div><p class="tiny">Test laptop speaker first; Bluetooth can introduce noticeable delay.</p></section><section class="panel"><div class="eyebrow">02 / MIXER</div><h2>Vocal effects</h2><div class="head"><b>Mic input</b><span class="pill" id="meterVal">0%</span></div><div class="meter"><div id="bar"></div></div><div class="buttons"><button id="latency">Low latency: ON</button><button id="mute" class="secondary">Mute mic</button></div><div class="presets" style="margin-top:16px">'+Object.keys(profiles).map(k=>'<button data-profile="'+k+'" class="'+(k==='Dry'?'active':'')+'">'+k+'</button>').join('')+'</div><div class="sliders">'+fields+'</div><p class="tiny">Dry voice has a direct, undelayed effects path. Turn Low latency OFF to hear reverb and echo.</p></section></div><section class="panel music"><b>Music: YouTube</b><p>Open a karaoke instrumental in another tab. YouTube volume is controlled separately.</p><a href="https://www.youtube.com/results?search_query=karaoke+instrumental" target="_blank" rel="noopener">Open YouTube</a></section></main>';
 if(window.QRCode)try{new QRCode($('qr'),{text:link.href,width:162,height:162,correctLevel:QRCode.CorrectLevel.M})}catch(e){fail(e)}else message('QR library unavailable; copy link instead.','error');
 if(['localhost','127.0.0.1'].includes(location.hostname))message('For iPhone, open the HTTPS Netlify URL on your laptop first.','error');
 $('copy').onclick=async()=>{try{await navigator.clipboard.writeText(link.href);message('Link copied.','good')}catch{prompt('Copy phone link:',link.href)}};
 $('refresh').onclick=outputs;$('output').onchange=async()=>{deviceId=$('output').value;if(!audio)return;try{if(deviceId==='default'){message('For default output, reconnect mic after selecting Windows default.','good')}else if(typeof audio.ctx.setSinkId==='function'){await audio.ctx.setSinkId(deviceId);message('Output switched.','good')}else message('Browser cannot route this output; choose Windows default and reconnect.','error')}catch(e){fail(e)}};outputs();
 $('resume').onclick=async()=>{try{if(audio){await audio.ctx.resume();message('Audio: '+audio.ctx.state,'good')}else message('Connect the iPhone mic first.')}catch(e){fail(e)}};
 $('disconnect').onclick=()=>{stopCall();message('Disconnected.')};
 $('latency').onclick=()=>{lowLatency=!lowLatency;$('latency').textContent='Low latency: '+(lowLatency?'ON':'OFF');audio?.update();message(lowLatency?'Dry voice only (effects bypassed).':'Reverb and echo enabled.','good')};
 $('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'Unmute mic':'Mute mic';audio?.update()};
 const apply=p=>{for(const[k,v]of Object.entries(p)){$(k).value=v;$(k+'Val').textContent=v+'%'}audio?.update()};
 Object.keys(defaults).forEach(k=>$(k).oninput=()=>{$(k+'Val').textContent=$(k).value+'%';audio?.update();document.querySelectorAll('[data-profile]').forEach(b=>b.classList.remove('active'))});
 document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{apply(profiles[b.dataset.profile]);document.querySelectorAll('[data-profile]').forEach(x=>x.classList.toggle('active',x===b))});
 $('reject').onclick=()=>{pending?.close();pending=null;$('incoming').classList.add('hidden');message('Rejected.')};
 $('accept').onclick=async()=>{if(!pending)return;const incoming=pending;pending=null;$('incoming').classList.add('hidden');stopCall();call=incoming;const token=acceptToken;standbyCtx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});standbyCtx.resume().catch(fail);watch(incoming);
 incoming.on('stream',async s=>{if(call!==incoming)return;try{remoteTrack=s.getAudioTracks()[0];if(!remoteTrack)throw Error('No remote audio track');await startAudio(s,token);if(call!==incoming)return;$('connected').textContent='MIC CONNECTED';$('disconnect').disabled=false}catch(e){fail(e)}});
 incoming.on('close',()=>{if(call===incoming){stopCall();message('Mic disconnected.')}});incoming.on('error',fail);
 // Voice-only answer, no empty outbound stream.
 incoming.answer();message('Waiting for live audio…')};
 if(!window.Peer){message('Pairing library failed to load.','error');return}
 peer=new Peer(room);
 peer.on('open',()=>message('Ready! Scan QR and start microphone.','good'));
 peer.on('call',c=>{if(call||pending){c.close();return}pending=c;$('incoming').classList.remove('hidden');message('Incoming microphone request. Press Accept mic.')});
 peer.on('error',fail);
}
async function toggleTestTone(){if(!call||!localStream){message('Connect microphone to laptop first.','error');return}const sender=call.peerConnection?.getSenders().find(s=>s.track?.kind==='audio');if(!sender){message('Audio sender not ready. Try after laptop accepts mic.','error');return}try{if(!toneActive){toneCtx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});const oscillator=toneCtx.createOscillator(),gain=toneCtx.createGain(),dest=toneCtx.createMediaStreamDestination();oscillator.type='sine';oscillator.frequency.value=550;gain.gain.value=.12;oscillator.connect(gain).connect(dest);toneOsc=oscillator;toneTrack=dest.stream.getAudioTracks()[0];await toneCtx.resume();oscillator.start();await sender.replaceTrack(toneTrack);toneActive=true;$('testTone').textContent='Stop test tone';message('Test tone is being sent to laptop. Do you hear it?','good')}else{await sender.replaceTrack(localStream.getAudioTracks()[0]);toneActive=false;if(toneOsc){toneOsc.stop();toneOsc=null}toneTrack?.stop();toneTrack=null;await toneCtx?.close();toneCtx=null;$('testTone').textContent='Send test tone';message('iPhone microphone restored.','good')}}catch(e){fail(e)}}
function watchPhone(c){if(phoneStatsTimer)clearInterval(phoneStatsTimer);let previousPackets=null,previousBytes=null;async function inspect(){if(call!==c)return;const pc=c.peerConnection,track=localStream?.getAudioTracks()[0];let packets=null,bytes=null,energy=null;try{const stats=await pc.getStats();stats.forEach(s=>{if(s.type==='outbound-rtp'&&(s.kind==='audio'||s.mediaType==='audio')&&!s.isRemote){packets=s.packetsSent??null;bytes=s.bytesSent??null}if(s.type==='media-source'&&s.kind==='audio')energy=s.audioLevel??null})}catch(e){}if($('phoneDiag'))$('phoneDiag').textContent='Mic track: '+(track?(track.enabled?'enabled':'disabled')+'/'+(track.muted?'muted':'live')+'/'+track.readyState:'missing')+' · ICE: '+(pc?.iceConnectionState||'connecting')+' · Sent packets: '+(packets??'?')+' · Sent bytes: '+(bytes??'?')+(energy===null?'':' · Source signal: '+(energy*100).toFixed(1)+'%');if(packets!==null&&previousPackets!==null&&packets===previousPackets)message('Outgoing audio packets not increasing. Try reconnecting.','error');previousPackets=packets;previousBytes=bytes}inspect();phoneStatsTimer=setInterval(inspect,2500)}
function mobile(){
 $('app').innerHTML='<main class="phone"><div class="brand"><em>♫</em>Karaoke Studio <small>v2</small></div><div class="phoneTop"><div class="orb">🎤</div><h1>Phone microphone</h1><p>Keep Safari open and the screen awake while singing.</p></div><section class="panel"><b>Room connection</b><input type="text" id="room" placeholder="Scan laptop QR for room" autocomplete="off"><button id="start" class="wide">Start microphone</button><div id="status" class="status">Ready.</div><div class="head"><b>Mic input level</b><b id="meterVal">0%</b></div><div class="meter"><div id="bar"></div></div><div class="diag" id="phoneDiag">Audio sender diagnostics: waiting</div><button id="testTone" class="secondary wide" disabled>Send test tone</button><p class="tiny">Test tone is a quiet 550 Hz diagnostic sound. Lower laptop volume before using.</p><button id="stop" class="secondary wide" disabled>Stop microphone</button></section></main>';
 $('room').value=query.get('room')||'';
 $('stop').onclick=()=>{stopPhone();message('Mic stopped.')};$('testTone').onclick=toggleTestTone;
 $('start').onclick=async()=>{
 requestedRoom=$('room').value.trim();if(!/^ks-[a-f0-9]{24}$/.test(requestedRoom)){message('Scan QR to get valid room.','error');return}
 if(!window.Peer||!navigator.mediaDevices?.getUserMedia){message('Mic needs HTTPS, browser permission and internet.','error');return}
 $('start').disabled=true;
 try{localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});
 const ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'}),src=ctx.createMediaStreamSource(localStream),analyser=ctx.createAnalyser();analyser.fftSize=1024;src.connect(analyser);phoneMeter=ctx;ctx.resume().catch(()=>{});measure(analyser,ctx,'phone');
 peer=new Peer();peer.on('open',()=>{call=peer.call(requestedRoom,localStream);if(!call){stopPhone();message('Call failed.','error');return}message('Request sent. Accept mic on laptop.','good');$('stop').disabled=false;$('testTone').disabled=false;watchPhone(call);call.on('close',()=>{stopPhone();message('Call ended.')});call.on('error',e=>{fail(e);stopPhone()})});peer.on('error',e=>{fail(e);stopPhone()});
 }catch(e){stopPhone();fail(e)}
 };
}
if(isPhone)mobile();else desktop();
window.addEventListener('beforeunload',()=>{if(isPhone)stopPhone();else{stopCall();peer?.destroy()}});
})();
</script></body></html>
