<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karaoke latency patcher</title>
<style>
:root{color-scheme:light dark}
body{font:16px system-ui,sans-serif;max-width:560px;margin:0 auto;padding:24px 18px}
button,input{font:inherit;margin:8px 0}
button{padding:12px 16px;border-radius:10px;border:0;background:#865fec;color:#fff;font-weight:700}
button:disabled{opacity:.4}
pre{white-space:pre-wrap;padding:12px;border-radius:10px;background:rgba(128,128,128,.15)}
</style></head><body>
<h1>Karaoke latency patcher</h1>
<p>1. Download your current <b>index.html</b> from GitHub (open the file, then Raw, then save).<br>
2. Choose it below.<br>
3. Download the fixed file and upload it to your repo over the old one.</p>
<input type="file" id="f" accept=".html">
<button id="go" disabled>Apply fixes</button>
<pre id="log">Waiting for a file…</pre>
<a id="dl" download="index.html" hidden><button>Download fixed index.html</button></a>
<script>
const fixes=[
["echo fix 1","const init={volume:72,reverb:35,echo:22,bass:50,treble:50};","const init={volume:72,reverb:35,echo:0,bass:50,treble:50};"],
["echo fix 2","Concert:{volume:72,reverb:65,echo:36,bass:55,treble:55}","Concert:{volume:72,reverb:65,echo:18,bass:55,treble:55}"],
["echo fix 3","delay.delayTime.value=.23","delay.delayTime.value=.12"],
["auto-start Fast Audio","Tap Enable laptop audio.','success')}catch(e){fail(e)}","Tap Enable laptop audio.','success');if(!fastConn?.open)toggleFast()}catch(e){fail(e)}"],
["Fast Audio starts when channel opens","status('Fast Audio connected. Press Start Fast Audio.','success')});","enableFastPlayer().catch(e=>{stopFastPlayer();rawMode=false;engine?.update();fail(e)})});"]
];
let text="";
const $=id=>document.getElementById(id);
$("f").onchange=async e=>{const file=e.target.files[0];if(!file)return;text=await file.text();$("go").disabled=false;$("log").textContent="Loaded "+file.name+" ("+text.length+" characters)."};
$("go").onclick=()=>{
  let out=text,lines=[],ok=true;
  for(const [name,a,b] of fixes){
    const n=out.split(a).length-1;
    if(n===1){out=out.replace(a,()=>b);lines.push("✓ "+name)}
    else if(out.includes(b)){lines.push("• "+name+": already applied")}
    else{ok=false;lines.push("✗ "+name+": text not found ("+n+" matches)")}
  }
  $("log").textContent=lines.join("\n")+(ok?"\n\nDone. Download the fixed file below.":"\n\nSome fixes failed, so the file was not changed.");
  if(ok){const url=URL.createObjectURL(new Blob([out],{type:"text/html"}));$("dl").href=url;$("dl").hidden=false}
};
</script></body></html>
