function stopEngine(){if(rawAudio){rawAudio.pause();rawAudio.srcObject=null;rawAudio.remove();rawAudio=null}rawMode=false;if(diagnosticTimer){clearInterval(diagnosticTimer);diagnosticTimer=null}receivedTrack=null;cancelAnimationFrame(frame);if(engine){engine.ctx.close().catch(()=>{});engine=null}if($('bar'))$('bar').style.width='0%'}
function stopCall(){fastConn?.open&&fastConn.send('fast:stop');stopFastPlayer();if(fastConn){fastConn.close();fastConn=null}const c=call;call=null;if(c)c.close();stopEngine();if(unlockedContext){unlockedContext.close().catch(()=>{});unlockedContext=null}if($('connection'))$('connection').textContent='WAITING FOR MIC';if($('disconnect'))$('disconnect').disabled=true;if($('raw')){$('raw').disabled=true;$('raw').textContent='Test direct audio'}}
function stopPhone(){stopFastCapture();if(fastConn){fastConn.close();fastConn=null}if(phoneMeter){cancelAnimationFrame(phoneMeter.frame);phoneMeter.ctx.close().catch(()=>{});phoneMeter=null}const c=call;call=null;if(c)c.close();if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}if(peer){peer.destroy();peer=null}if($('start'))$('start').disabled=false;if($('stop'))$('stop').disabled=true;if($('bar'))$('bar').style.width='0%'}
function localMeter(s){try{const ctx=new (window.AudioContext||window.webkitAudioContext)(),source=ctx.createMediaStreamSource(s),analyser=ctx.createAnalyser();analyser.fftSize=1024;source.connect(analyser);const values=new Uint8Array(analyser.fftSize);phoneMeter={ctx,frame:0};function tick(){if(!phoneMeter||phoneMeter.ctx!==ctx)return;analyser.getByteTimeDomainData(values);let sum=0;for(const v of values){const n=(v-128)/128;sum+=n*n}const level=Math.min(100,Math.round(Math.sqrt(sum/values.length)*350));$('bar').style.width=level+'%';$('meterValue').textContent=level+'%';phoneMeter.frame=requestAnimationFrame(tick)}ctx.resume().catch(()=>{});tick()}catch(e){fail(e)}}
function meter(node,ctx){const data=new Uint8Array(node.fftSize);function tick(){if(!engine||engine.ctx!==ctx)return;node.getByteTimeDomainData(data);let total=0;for(const x of data){const y=(x-128)/128;total+=y*y}const n=Math.min(100,Math.round(Math.sqrt(total/data.length)*300));$('bar').style.width=n+'%';$('meterValue').textContent=n+'%';frame=requestAnimationFrame(tick)}tick()}
async function createEngine(media){
 cancelAnimationFrame(frame);const ctx=unlockedContext||new (window.AudioContext||window.webkitAudioContext)();unlockedContext=null;ctx.resume().catch(()=>{});
 const src=ctx.createMediaStreamSource(media),hp=ctx.createBiquadFilter(),low=ctx.createBiquadFilter(),high=ctx.createBiquadFilter(),gain=ctx.createGain(),analyser=ctx.createAnalyser(),dry=ctx.createGain(),wet=ctx.createGain(),echoWet=ctx.createGain(),delay=ctx.createDelay(1),feedback=ctx.createGain(),reverb=ctx.createConvolver(),master=ctx.createGain(),limiter=ctx.createDynamicsCompressor();
 hp.type='highpass';hp.frequency.value=85;low.type='lowshelf';low.frequency.value=240;high.type='highshelf';high.frequency.value=3000;delay.delayTime.value=.23;feedback.gain.value=.21;analyser.fftSize=1024;limiter.threshold.value=-10;limiter.ratio.value=12;
 const len=ctx.sampleRate*2,buffer=ctx.createBuffer(2,len,ctx.sampleRate);for(let c=0;c<2;c++){const a=buffer.getChannelData(c);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8)}reverb.buffer=buffer;
 src.connect(hp).connect(low).connect(high).connect(gain).connect(analyser);
 analyser.connect(dry).connect(master);analyser.connect(reverb).connect(wet).connect(master);analyser.connect(delay).connect(echoWet).connect(master);delay.connect(feedback).connect(delay);master.connect(limiter).connect(ctx.destination);

}
function tuneJitter(c){let available=false;try{for(const receiver of c.peerConnection?.getReceivers?.()||[]){if(receiver.track?.kind==='audio'&&'jitterBufferTarget' in receiver){receiver.jitterBufferTarget=lowBuffer?0:null;available=true}}}catch(e){console.warn('Jitter buffer setting unavailable',e)}return available}

const KARA_CAPTURE_WORKLET="class KaraCapture extends AudioWorkletProcessor {\n constructor(){super();this.buf=new Float32Array(512);this.n=0}\n process(inputs){const input=inputs[0]?.[0];if(input){for(let i=0;i<input.length;i++){this.buf[this.n++]=input[i];if(this.n===512){this.port.postMessage(this.buf.buffer,[this.buf.buffer]);this.buf=new Float32Array(512);this.n=0}}}return true}\n} registerProcessor('kara-capture',KaraCapture);";

let fastConn=null,fastCapture=null,fastPlayer=null,fastActive=false,fastRequested=false,fastPackets=0,fastPacketTimestamp=0;

async function startFastCapture(){
 if(!stream||!fastConn?.open||fastCapture)return;
 try{
  const ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});

   if(fastCapture!==item||!fastConn?.open)return;

   const dc=fastConn.dataChannel;
   if(dc&&dc.bufferedAmount<32000)fastConn.send(bytes);
  };

 }catch(e){stopFastCapture();fail(e)}
}

async function enableFastPlayer(){

function prepareFastDesktop(connection){
 fastConn=connection;connection.on('data',d=>{
  if(!fastActive||!fastPlayer)return;
  if(!(d instanceof ArrayBuffer)&&!ArrayBuffer.isView(d))return;
  const bytes=d instanceof ArrayBuffer?d:d.buffer.slice(d.byteOffset,d.byteOffset+d.byteLength);
  if(bytes.byteLength<6)return;
  const view=new DataView(bytes),hz=view.getUint32(0,true),length=(bytes.byteLength-4)/2;
  if(hz<8000||hz>192000||length<1||length>4096)return;
  const input=new Float32Array(length);for(let i=0;i<length;i++)input[i]=view.getInt16(4+i*2,true)/32768;
  let output=input;
  if(hz!==fastPlayer.ctx.sampleRate){
   const n=Math.round(length*fastPlayer.ctx.sampleRate/hz),out=new Float32Array(n);
   for(let i=0;i<n;i++){const at=i*hz/fastPlayer.ctx.sampleRate,first=Math.min(length-1,Math.floor(at));out[i]=input[first]*(1-(at-first))+input[Math.min(length-1,first+1)]*(at-first)}output=out
  }

 });connection.on('close',()=>{if(fastConn===connection){stopFastPlayer();fastConn=null;if($('fast'))$('fast').disabled=true;rawMode=false;engine?.update();status('Fast channel closed; standard audio available.','error')}});

}

function observeCall(c){if(diagnosticTimer)clearInterval(diagnosticTimer);let previousPackets=null,previousEnergy=null,previousDuration=null,previousJitter=null,previousEmitted=null,previousTargetDelay=null,previousMinimumDelay=null;async function inspect(){if(call!==c)return;const pc=c.peerConnection;tuneJitter(c);const ice=pc?.iceConnectionState||'initializing';const state=pc?.connectionState||'unknown';const track=receivedTrack;let packets=null,bytes=null,energy=null,duration=null,level=null,jitter=null,emitted=null,network='unknown',rtt=null,packetJitter=null,bufferTarget=null,renderDelay=null,targetTotal=null,minimumTotal=null,packetsLost=null,concealed=null,receivedSamples=null;try{if(pc){const stats=await pc.getStats();let selectedPair=null,transport=null;stats.forEach(s=>{if(s.type==='inbound-rtp'&&(s.kind==='audio'||s.mediaType==='audio')&&!s.isRemote){packets=s.packetsReceived??null;packetsLost=s.packetsLost??null;concealed=s.concealedSamples??null;receivedSamples=s.totalSamplesReceived??null;bytes=s.bytesReceived??null;energy=s.totalAudioEnergy??null;duration=s.totalSamplesDuration??null;level=s.audioLevel??null;jitter=s.jitterBufferDelay??null;emitted=s.jitterBufferEmittedCount??null;packetJitter=typeof s.jitter==='number'?s.jitter*1000:null;bufferTarget=s.jitterBufferTargetDelay??null;targetTotal=s.jitterBufferTargetDelay??null;minimumTotal=s.jitterBufferMinimumDelay??null;}if(s.type==='transport'&&s.selectedCandidatePairId)transport=s;if(s.type==='candidate-pair'&&(s.selected||s.nominated)&&s.state==='succeeded')selectedPair=s});if(transport)selectedPair=stats.get(transport.selectedCandidatePairId)||selectedPair;if(selectedPair){rtt=typeof selectedPair.currentRoundTripTime==='number'?selectedPair.currentRoundTripTime*1000:null;const local=stats.get(selectedPair.localCandidateId),remote=stats.get(selectedPair.remoteCandidateId);network=(local?.candidateType==='relay'||remote?.candidateType==='relay')?'relay':local&&remote?'direct ('+local.candidateType+'/'+remote.candidateType+')':'connected'}const receiver=pc.getReceivers?.().find(x=>x.track?.kind==='audio');renderDelay=receiver?.jitterBufferTarget??null;}}catch(e){}const deltaEnergy=energy!==null&&previousEnergy!==null&&duration!==null&&previousDuration!==null&&duration>previousDuration?Math.sqrt(Math.max(0,(energy-previousEnergy)/(duration-previousDuration))):null;previousEnergy=energy;previousDuration=duration;let jitterMs=null;if(jitter!==null&&emitted!==null&&previousJitter!==null&&previousEmitted!==null&&emitted>previousEmitted)jitterMs=(jitter-previousJitter)/(emitted-previousEmitted)*1000;let actualTargetMs=targetTotal!==null&&previousTargetDelay!==null&&emitted!==null&&previousEmitted!==null&&emitted>previousEmitted?(targetTotal-previousTargetDelay)/(emitted-previousEmitted)*1000:null;let minimumMs=minimumTotal!==null&&previousMinimumDelay!==null&&emitted!==null&&previousEmitted!==null&&emitted>previousEmitted?(minimumTotal-previousMinimumDelay)/(emitted-previousEmitted)*1000:null;previousTargetDelay=targetTotal;previousMinimumDelay=minimumTotal;previousJitter=jitter;previousEmitted=emitted;let sentence='ICE: '+ice+' | Connection: '+state+' | Remote track: '+(track?track.readyState+'/'+(track.muted?'muted':'active'):'not received')+' | Audio packets: '+(packets??'none')+' | Audio signal: '+(deltaEnergy!==null?(deltaEnergy*100).toFixed(2)+'%':level!==null?(level*100).toFixed(2)+'%':'unknown')+' | Audio context: '+(engine?.ctx.state||'not started')+' | Jitter buffer: '+(jitterMs===null?'n/a':jitterMs.toFixed(0)+'ms')+' | Packet jitter: '+(packetJitter===null?'n/a':packetJitter.toFixed(0)+'ms')+' | Network: '+network+' | RTT: '+(rtt===null?'n/a':rtt.toFixed(0)+'ms')+' | Requested target: '+(renderDelay===null?'unsupported':renderDelay+'ms')+' | Browser target: '+(actualTargetMs===null?'n/a':actualTargetMs.toFixed(0)+'ms')+' | Network minimum: '+(minimumMs===null?'n/a':minimumMs.toFixed(0)+'ms')+' | Packet loss: '+(packetsLost??'n/a')+' | Concealed audio: '+(concealed===null||receivedSamples===null||receivedSamples===0?'n/a':(concealed/receivedSamples*100).toFixed(1)+'%')+' | Fast PCM: '+(fastActive?'ON / '+fastPackets+' packets':'OFF');if($('diagnostic'))$('diagnostic').textContent=sentence;if(packets!==null&&previousPackets!==null&&packets===previousPackets&&ice==='connected'&&track){status('Connected but no incoming audio packets. Check iPhone Safari connection / Wi-Fi.','error')}previousPackets=packets;if((ice==='failed'||state==='failed')&&$('status'))status('WebRTC transport failed. Try the same Wi-Fi network or another network.','error')}inspect();diagnosticTimer=setInterval(inspect,2000)}
function desktop(){
 const room=roomId(),url=new URL(location.href);url.search=new URLSearchParams({mode:'mic',room});url.hash='';
 const sliders=Object.keys(init).map(k=>'<div class="field"><label for="'+k+'">'+({volume:'Mic Volume',reverb:'Reverb',echo:'Echo',bass:'Bass',treble:'Treble'}[k])+'<span id="'+k+'Value">'+init[k]+'%</span></label><input type="range" min="0" max="100" id="'+k+'" value="'+init[k]+'"></div>').join('');
 $('app').innerHTML='<main><header class="brand"><b>♫</b> Karaoke Studio</header><h1>Sing louder.<br><em>Sound better.</em></h1><p>Play YouTube karaoke in another tab. Your phone is the mic, and your laptop is the mixer.</p><div class="grid"><section class="panel"><div class="titleline"><div><small>01 / CONNECT</small><h2>Wireless microphone</h2></div><span class="pill" id="connection">WAITING FOR MIC</span></div><div class="pair"><div id="qr"></div><aside><b>Scan with iPhone</b><p>Scan QR, tap Start microphone, then accept on laptop.</p><div class="room">Room: '+room+'</div><button class="secondary" id="copy">Copy phone link</button></aside></div><div id="incoming" class="incoming hidden"><b>Incoming microphone request</b><p>Approve this phone?</p><div class="buttons"><button id="accept">Accept mic</button><button class="secondary" id="reject">Reject</button></div></div><div id="status" class="status">Connecting…</div><div id="diagnostic" class="room" style="margin:0 0 15px;line-height:1.6">Diagnostic: waiting for mic</div><p class="tip">RTT is network round-trip time. Browser target and network minimum help explain buffering; 0ms is only a hint, not guaranteed. These are not full mouth-to-speaker delay measurements.</p><div class="buttons" style="margin-bottom:14px"><button id="copyDiag" class="secondary">Copy latency diagnostic</button></div><div class="buttons"><button id="audio">Enable laptop audio</button><button id="buffer" class="secondary">Low buffer: ON</button><button id="raw" class="secondary" disabled>Test direct audio</button><button id="fast" class="secondary" disabled>Fast Audio (experimental)</button><button class="secondary" id="disconnect" disabled>Disconnect mic</button></div></section><section class="panel"><div class="titleline"><div><small>02 / VOCAL EFFECTS</small><h2>Live mixer</h2></div><span class="pill">LIVE FX</span></div><div class="meter-label"><span>MIC INPUT LEVEL</span><span id="meterValue">0%</span></div><div class="meter"><div id="bar"></div></div><div class="presets">'+Object.keys(presets).map(p=>'<button data-preset="'+p+'" class="'+(p==='Karaoke Room'?'active':'')+'">'+p+'</button>').join('')+'</div><div class="sliders">'+sliders+'</div><div class="buttons"><button id="mute">Mute mic</button><button id="reset" class="secondary">Reset effects</button></div><p class="tip">Keep phone away from speakers. Wired speakers have less delay than Bluetooth.</p></section></div><section class="music"><div><b>▶ YouTube karaoke</b><p>Play a karaoke track in another tab. Adjust music volume in YouTube.</p></div><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=karaoke+instrumental">Open YouTube</a></section></main>';
 if(window.QRCode){try{new QRCode($('qr'),{text:url.href,width:155,height:155,colorDark:'#15101f',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){fail(e)}}else status('QR library unavailable. Use Copy phone link.','error');if(['localhost','127.0.0.1'].includes(location.hostname))status('QR is visible, but iPhone cannot access laptop localhost. Deploy to HTTPS Netlify and open that URL on laptop.','error');
 $('copyDiag').onclick=async()=>{const value=$('diagnostic')?.textContent||'No diagnostics yet';try{await navigator.clipboard.writeText(value);status('Diagnostic copied.','success')}catch{prompt('Copy diagnostic:',value)}};
 $('copy').onclick=async()=>{try{await navigator.clipboard.writeText(url.href);$('copy').textContent='Copied!'}catch{prompt('Copy URL:',url.href)}};
 $('audio').onclick=async()=>{try{if(engine){await engine.ctx.resume();status('Audio context: '+engine.ctx.state,'success')}else{let c=new AudioContext();await c.resume();await c.close();status('Laptop audio unlocked. Connect mic to test.','success')}}catch(e){fail(e)}};
 $('fast').onclick=toggleFast;
 $('disconnect').onclick=()=>{stopCall();status('Mic disconnected.')};$('raw').onclick=async()=>{if(fastActive){fastConn?.open&&fastConn.send('fast:stop');stopFastPlayer();rawMode=false;engine?.update()}if(!receivedTrack||!engine)return;rawMode=!rawMode;engine.update();if(rawMode){try{rawAudio=document.createElement('audio');rawAudio.autoplay=true;rawAudio.playsInline=true;rawAudio.srcObject=new MediaStream([receivedTrack]);rawAudio.style.display='none';document.body.appendChild(rawAudio);await rawAudio.play();$('raw').textContent='Back to mixer';status('Direct audio test ON. Speak into phone; mixer is temporarily bypassed.','success')}catch(e){rawMode=false;engine.update();fail(e)}}else{if(rawAudio){rawAudio.pause();rawAudio.srcObject=null;rawAudio.remove();rawAudio=null}$('raw').textContent='Test direct audio';status('Mixer audio restored.','success')}};
 $('buffer').onclick=()=>{lowBuffer=!lowBuffer;const supported=call?tuneJitter(call):false;$('buffer').textContent='Low buffer: '+(lowBuffer?'ON':'OFF');status(lowBuffer?(supported?'Requested minimum WebRTC jitter buffer (0ms).':'Low buffer requested; browser may not support it.'):'Browser-managed buffering restored.','success')};
 $('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'Unmute mic':'Mute mic';if(fastPlayer)fastPlayer.gain.gain.value=muted?0:1;engine?.update()};
 const apply=v=>{for(const[k,n]of Object.entries(v)){$(k).value=n;$(k+'Value').textContent=n+'%'}engine?.update()};
 $('reset').onclick=()=>apply(init);for(const k of Object.keys(init))$(k).oninput=()=>{$(k+'Value').textContent=$(k).value+'%';engine?.update();document.querySelectorAll('[data-preset]').forEach(b=>b.classList.remove('active'))};
 document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{apply(presets[b.dataset.preset]);document.querySelectorAll('[data-preset]').forEach(x=>x.classList.toggle('active',x===b))});
 $('reject').onclick=()=>{waiting?.close();waiting=null;$('incoming').classList.add('hidden');status('Request rejected.')};
 $('accept').onclick=()=>{if(!waiting)return;const c=waiting;waiting=null;$('incoming').classList.add('hidden');stopCall();call=c;unlockedContext=new (window.AudioContext||window.webkitAudioContext)();unlockedContext.resume().catch(()=>{});observeCall(c);c.on('stream',async s=>{if(call!==c)return;try{if(!s.getAudioTracks().length)throw Error('No remote audio track from iPhone');receivedTrack=s.getAudioTracks()[0];tuneJitter(c);receivedTrack.onmute=()=>{status('Remote audio track is muted: waiting for iPhone packets.','error')};receivedTrack.onunmute=()=>status('Remote audio track is active.','success');await createEngine(s);$('connection').textContent='MIC CONNECTED';$('disconnect').disabled=false;$('raw').disabled=false;status(engine.ctx.state==='running'?'Audio stream received. Talk into iPhone and check meter.':'Audio stream received, but playback is blocked. Tap Enable laptop audio.','success')}catch(e){fail(e)}});c.answer();status('Waiting for audio from iPhone…');c.on('close',()=>{if(call===c){stopCall();status('Mic disconnected.')}});c.on('error',fail)};
 if(!window.Peer){status('PeerJS unavailable; check internet.','error');return}
 peer=new Peer(room);peer.on('open',()=>status('Ready. Scan QR with your phone.','success'));peer.on('connection',c=>{if(c.label!=='kara-fast'){c.close();return}if(fastConn){c.close();return}prepareFastDesktop(c)});peer.on('call',c=>{if(waiting||call){c.close();return}waiting=c;$('incoming').classList.remove('hidden');status('Incoming mic request — press Accept mic.')});peer.on('error',fail);
}
function mobile(){
 $('app').innerHTML='<main class="phone"><header class="brand"><b>♫</b> Karaoke Studio</header><div class="phone-hero"><div class="orb">🎤</div><h1>Ready to sing?</h1><p>Your iPhone becomes a wireless microphone. Keep Safari open while singing.</p></div><section class="panel"><b>Connect to laptop</b><input id="roomInput" type="text" placeholder="Room code" autocomplete="off"><label class="tip" style="display:flex;gap:8px;align-items:center;margin:8px 0 14px"><input id="fastCapture" type="checkbox" style="width:auto;accent-color:#9e65e8"> Latency test: no iPhone mic meter</label><button id="start" class="wide">Start microphone</button><div class="status" id="status">Ready.</div><div class="meter-label"><span>MICROPHONE</span><span id="meterValue">—</span></div><div class="meter"><div id="bar"></div></div><button id="stop" class="secondary wide" disabled>Stop microphone</button></section><p class="tip">Approve microphone permission. Keep this page and screen awake; control effects on laptop.</p></main>';
 $('roomInput').value=params.get('room')||'';
 $('stop').onclick=()=>{stopPhone();status('Microphone stopped.')};
 $('start').onclick=async()=>{const room=$('roomInput').value.trim();if(!/^ks-[a-f0-9]{24}$/.test(room)){status('Invalid room code. Scan QR from laptop.','error');return}if(!navigator.mediaDevices?.getUserMedia){status('Microphone needs HTTPS and permission.','error');return}if(!window.Peer){status('PeerJS not loaded.','error');return}
 skipPhoneMeter=$('fastCapture').checked;$('start').disabled=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});if(!stream.getAudioTracks().length)throw Error('iPhone gave no microphone audio track');if(!skipPhoneMeter)localMeter(stream);else{$('meterValue').textContent='OFF';status('Latency test: phone audio meter disabled.');}peer=new Peer();status('Microphone ready. Talk to check the meter, then accept on laptop.');
 peer.on('open',()=>{const data=peer.connect(room,{label:'kara-fast',serialization:'binary',reliable:false});prepareFastPhone(data);call=peer.call(room,stream);if(!call){stopPhone();status('Connection failed.','error');return}status('Request sent. Press Accept mic on laptop.');$('stop').disabled=false;call.on('close',()=>{stopPhone();status('Connection closed.')});call.on('error',e=>{fail(e);stopPhone()})});
 peer.on('error',e=>{fail(e);stopPhone()})}catch(e){fail(e);stopPhone()}};
}
if(phone)mobile();else desktop();addEventListener('beforeunload',()=>{stopCall();if(stream)stream.getTracks().forEach(t=>t.stop());peer?.destroy()});
})();
</script></body></html>
