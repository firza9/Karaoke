<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karaoke Studio</title><meta name="theme-color" content="#15101f">
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#302043,#15101f 65%);color:#f7f2ff;min-height:100vh}main{max-width:1020px;margin:auto;padding:30px 18px}h1{font-size:clamp(36px,6vw,64px);line-height:1.05;margin:55px 0 10px}h1 em{color:#af8aff;font-style:normal}p{color:#bfb5d0;line-height:1.6}.brand{font-size:22px;font-weight:800}.brand b{background:#7650e5;padding:9px 13px;border-radius:13px;margin-right:8px}.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;margin-top:35px}.panel{background:#262033;border:1px solid #4a3b5b;border-radius:22px;padding:23px}h2{margin:5px 0 18px;font-size:23px}small{color:#ad9ec4;font-weight:700;letter-spacing:.12em}.pair{display:flex;align-items:center;gap:16px;flex-wrap:wrap}#qr{background:#fff;padding:10px;border-radius:10px;width:175px;height:175px;display:flex;align-items:center;justify-content:center}#qr img,#qr canvas{display:block;width:155px!important;height:155px!important}.pair aside{flex:1;min-width:130px}.room{font-size:11px;word-break:break-all;color:#ad9ec4}.status{background:#393049;padding:13px;margin:17px 0;border-radius:10px;font-size:13px}.status[data-kind=error]{background:#592a3d;color:#ffc1cb}.status[data-kind=success]{background:#25493d;color:#b7f7ce}button{background:#865fec;color:#fff;border:0;border-radius:11px;padding:12px 16px;font-weight:700;cursor:pointer}button.secondary{background:#433750}button:disabled{opacity:.45;cursor:not-allowed}.buttons,.presets{display:flex;gap:8px;flex-wrap:wrap}.presets{margin:16px 0}.presets button{background:#493a60;font-size:12px}.presets button.active{background:#865fec}.field{margin:16px 0}.field label{display:flex;justify-content:space-between;font-weight:650;margin-bottom:6px}.field span{color:#b8a3f0}input[type=range]{width:100%;accent-color:#a47bff}.sliders{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.meter{height:10px;background:#473a58;border-radius:30px;overflow:hidden}.meter div{height:100%;width:0;background:linear-gradient(90deg,#7650e5,#e698da)}.meter-label{display:flex;justify-content:space-between;font-size:12px;color:#bfb5d0;margin:12px 0 6px}.incoming{border:1px solid #a17fff;background:#392a54;border-radius:13px;padding:14px;margin:15px 0}.hidden{display:none}.music{background:#262033;border:1px solid #4a3b5b;border-radius:18px;margin-top:20px;padding:22px;display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}.music a{background:#bd344e;color:white;text-decoration:none;padding:12px;border-radius:10px;font-weight:700}.phone{max-width:480px}.phone-hero{text-align:center;padding:70px 0 30px}.orb{width:145px;height:145px;display:grid;place-items:center;border-radius:100%;margin:auto;background:linear-gradient(135deg,#a47bff,#5b389d);font-size:70px}.phone h1{font-size:42px;margin:30px 0 8px}input[type=text]{width:100%;background:#171222;border:1px solid #655378;border-radius:10px;color:white;padding:13px;margin:14px 0}.wide{display:block;width:100%;margin:10px 0}.tip{font-size:12px}.titleline{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:11px;border-radius:30px;background:#45335d;padding:8px;color:#d8c8fa}@media(max-width:720px){.grid{grid-template-columns:1fr}.sliders{grid-template-columns:1fr 1fr}.panel{padding:18px}h1{margin-top:35px}}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),phone=params.get('mode')==='mic';
const init={volume:72,reverb:35,echo:22,bass:50,treble:50};
const presets={Clean:{volume:72,reverb:8,echo:0,bass:50,treble:50},'Karaoke Room':init,Concert:{volume:72,reverb:65,echo:36,bass:55,treble:55}};
let peer,call,stream,waiting,engine,muted=false,frame=0,phoneMeter=null;
function status(s,kind=''){if($('status')){$('status').textContent=s;$('status').dataset.kind=kind}}
function fail(e){status(e?.message||String(e),'error')}
function roomId(){return 'ks-'+Array.from(crypto.getRandomValues(new Uint8Array(12)),x=>x.toString(16).padStart(2,'0')).join('')}
function stopEngine(){cancelAnimationFrame(frame);if(engine){engine.ctx.close().catch(()=>{});engine=null}if($('bar'))$('bar').style.width='0%'}
function stopCall(){const c=call;call=null;if(c)c.close();stopEngine();if($('connection'))$('connection').textContent='WAITING FOR MIC';if($('disconnect'))$('disconnect').disabled=true}
function stopPhone(){if(phoneMeter){cancelAnimationFrame(phoneMeter.frame);phoneMeter.ctx.close().catch(()=>{});phoneMeter=null}const c=call;call=null;if(c)c.close();if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}if(peer){peer.destroy();peer=null}if($('start'))$('start').disabled=false;if($('stop'))$('stop').disabled=true;if($('bar'))$('bar').style.width='0%'}
function localMeter(s){try{const ctx=new (window.AudioContext||window.webkitAudioContext)(),source=ctx.createMediaStreamSource(s),analyser=ctx.createAnalyser();analyser.fftSize=1024;source.connect(analyser);const values=new Uint8Array(analyser.fftSize);phoneMeter={ctx,frame:0};function tick(){if(!phoneMeter||phoneMeter.ctx!==ctx)return;analyser.getByteTimeDomainData(values);let sum=0;for(const v of values){const n=(v-128)/128;sum+=n*n}const level=Math.min(100,Math.round(Math.sqrt(sum/values.length)*350));$('bar').style.width=level+'%';$('meterValue').textContent=level+'%';phoneMeter.frame=requestAnimationFrame(tick)}ctx.resume().catch(()=>{});tick()}catch(e){fail(e)}}
function meter(node,ctx){const data=new Uint8Array(node.fftSize);function tick(){if(!engine||engine.ctx!==ctx)return;node.getByteTimeDomainData(data);let total=0;for(const x of data){const y=(x-128)/128;total+=y*y}const n=Math.min(100,Math.round(Math.sqrt(total/data.length)*300));$('bar').style.width=n+'%';$('meterValue').textContent=n+'%';frame=requestAnimationFrame(tick)}tick()}
async function createEngine(media){
 stopEngine();const ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.resume().catch(()=>{});
 const src=ctx.createMediaStreamSource(media),hp=ctx.createBiquadFilter(),low=ctx.createBiquadFilter(),high=ctx.createBiquadFilter(),gain=ctx.createGain(),analyser=ctx.createAnalyser(),dry=ctx.createGain(),wet=ctx.createGain(),echoWet=ctx.createGain(),delay=ctx.createDelay(1),feedback=ctx.createGain(),reverb=ctx.createConvolver(),master=ctx.createGain(),limiter=ctx.createDynamicsCompressor();
 hp.type='highpass';hp.frequency.value=85;low.type='lowshelf';low.frequency.value=240;high.type='highshelf';high.frequency.value=3000;delay.delayTime.value=.23;feedback.gain.value=.21;analyser.fftSize=1024;limiter.threshold.value=-10;limiter.ratio.value=12;
 const len=ctx.sampleRate*2,buffer=ctx.createBuffer(2,len,ctx.sampleRate);for(let c=0;c<2;c++){const a=buffer.getChannelData(c);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8)}reverb.buffer=buffer;
 src.connect(hp).connect(low).connect(high).connect(gain).connect(analyser);
 analyser.connect(dry).connect(master);analyser.connect(reverb).connect(wet).connect(master);analyser.connect(delay).connect(echoWet).connect(master);delay.connect(feedback).connect(delay);master.connect(limiter).connect(ctx.destination);
 engine={ctx,update(){const v=Object.fromEntries(Object.keys(init).map(k=>[k,+$(k).value]));const t=ctx.currentTime;gain.gain.setTargetAtTime(Math.pow(v.volume/75,1.4),t,.02);low.gain.setTargetAtTime((v.bass-50)*.18,t,.02);high.gain.setTargetAtTime((v.treble-50)*.18,t,.02);dry.gain.setTargetAtTime(.9,t,.02);wet.gain.setTargetAtTime(v.reverb/100*.75,t,.02);echoWet.gain.setTargetAtTime(v.echo/100*.65,t,.02);master.gain.setTargetAtTime(muted?0:1,t,.02)}};
 engine.update();meter(analyser,ctx)
}
function desktop(){
 const room=roomId(),url=new URL(location.href);url.search=new URLSearchParams({mode:'mic',room});url.hash='';
 const sliders=Object.keys(init).map(k=>'<div class="field"><label for="'+k+'">'+({volume:'Mic Volume',reverb:'Reverb',echo:'Echo',bass:'Bass',treble:'Treble'}[k])+'<span id="'+k+'Value">'+init[k]+'%</span></label><input type="range" min="0" max="100" id="'+k+'" value="'+init[k]+'"></div>').join('');
 $('app').innerHTML='<main><header class="brand"><b>♫</b> Karaoke Studio</header><h1>Sing louder.<br><em>Sound better.</em></h1><p>Play YouTube karaoke in another tab. Your phone is the mic, and your laptop is the mixer.</p><div class="grid"><section class="panel"><div class="titleline"><div><small>01 / CONNECT</small><h2>Wireless microphone</h2></div><span class="pill" id="connection">WAITING FOR MIC</span></div><div class="pair"><div id="qr"></div><aside><b>Scan with iPhone</b><p>Scan QR, tap Start microphone, then accept on laptop.</p><div class="room">Room: '+room+'</div><button class="secondary" id="copy">Copy phone link</button></aside></div><div id="incoming" class="incoming hidden"><b>Incoming microphone request</b><p>Approve this phone?</p><div class="buttons"><button id="accept">Accept mic</button><button class="secondary" id="reject">Reject</button></div></div><div id="status" class="status">Connecting…</div><div class="buttons"><button id="audio">Enable laptop audio</button><button class="secondary" id="disconnect" disabled>Disconnect mic</button></div></section><section class="panel"><div class="titleline"><div><small>02 / VOCAL EFFECTS</small><h2>Live mixer</h2></div><span class="pill">LIVE FX</span></div><div class="meter-label"><span>MIC INPUT LEVEL</span><span id="meterValue">0%</span></div><div class="meter"><div id="bar"></div></div><div class="presets">'+Object.keys(presets).map(p=>'<button data-preset="'+p+'" class="'+(p==='Karaoke Room'?'active':'')+'">'+p+'</button>').join('')+'</div><div class="sliders">'+sliders+'</div><div class="buttons"><button id="mute">Mute mic</button><button id="reset" class="secondary">Reset effects</button></div><p class="tip">Keep phone away from speakers. Wired speakers have less delay than Bluetooth.</p></section></div><section class="music"><div><b>▶ YouTube karaoke</b><p>Play a karaoke track in another tab. Adjust music volume in YouTube.</p></div><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=karaoke+instrumental">Open YouTube</a></section></main>';
 if(window.QRCode){try{new QRCode($('qr'),{text:url.href,width:155,height:155,colorDark:'#15101f',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){fail(e)}}else status('QR library unavailable. Use Copy phone link.','error');if(['localhost','127.0.0.1'].includes(location.hostname))status('QR is visible, but iPhone cannot access laptop localhost. Deploy to HTTPS Netlify and open that URL on laptop.','error');
 $('copy').onclick=async()=>{try{await navigator.clipboard.writeText(url.href);$('copy').textContent='Copied!'}catch{prompt('Copy URL:',url.href)}};
 $('audio').onclick=async()=>{try{if(engine){await engine.ctx.resume();status('Audio context: '+engine.ctx.state,'success')}else{let c=new AudioContext();await c.resume();await c.close();status('Laptop audio unlocked. Connect mic to test.','success')}}catch(e){fail(e)}};
 $('disconnect').onclick=()=>{stopCall();status('Mic disconnected.')};
 $('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'Unmute mic':'Mute mic';engine?.update()};
 const apply=v=>{for(const[k,n]of Object.entries(v)){$(k).value=n;$(k+'Value').textContent=n+'%'}engine?.update()};
 $('reset').onclick=()=>apply(init);for(const k of Object.keys(init))$(k).oninput=()=>{$(k+'Value').textContent=$(k).value+'%';engine?.update();document.querySelectorAll('[data-preset]').forEach(b=>b.classList.remove('active'))};
 document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{apply(presets[b.dataset.preset]);document.querySelectorAll('[data-preset]').forEach(x=>x.classList.toggle('active',x===b))});
 $('reject').onclick=()=>{waiting?.close();waiting=null;$('incoming').classList.add('hidden');status('Request rejected.')};
 $('accept').onclick=()=>{if(!waiting)return;const c=waiting;waiting=null;$('incoming').classList.add('hidden');stopCall();call=c;c.on('stream',async s=>{if(call!==c)return;try{if(!s.getAudioTracks().length)throw Error('No remote audio track from iPhone');await createEngine(s);$('connection').textContent='MIC CONNECTED';$('disconnect').disabled=false;status(engine.ctx.state==='running'?'Audio stream received. Talk into iPhone and check meter.':'Audio stream received, but playback is blocked. Tap Enable laptop audio.','success')}catch(e){fail(e)}});c.answer();status('Waiting for audio from iPhone…');c.on('close',()=>{if(call===c){stopCall();status('Mic disconnected.')}});c.on('error',fail)};
 if(!window.Peer){status('PeerJS unavailable; check internet.','error');return}
 peer=new Peer(room);peer.on('open',()=>status('Ready. Scan QR with your phone.','success'));peer.on('call',c=>{if(waiting||call){c.close();return}waiting=c;$('incoming').classList.remove('hidden');status('Incoming mic request — press Accept mic.')});peer.on('error',fail);
}
function mobile(){
 $('app').innerHTML='<main class="phone"><header class="brand"><b>♫</b> Karaoke Studio</header><div class="phone-hero"><div class="orb">🎤</div><h1>Ready to sing?</h1><p>Your iPhone becomes a wireless microphone. Keep Safari open while singing.</p></div><section class="panel"><b>Connect to laptop</b><input id="roomInput" type="text" placeholder="Room code" autocomplete="off"><button id="start" class="wide">Start microphone</button><div class="status" id="status">Ready.</div><div class="meter-label"><span>MICROPHONE</span><span id="meterValue">—</span></div><div class="meter"><div id="bar"></div></div><button id="stop" class="secondary wide" disabled>Stop microphone</button></section><p class="tip">Approve microphone permission. Keep this page and screen awake; control effects on laptop.</p></main>';
 $('roomInput').value=params.get('room')||'';
 $('stop').onclick=()=>{stopPhone();status('Microphone stopped.')};
 $('start').onclick=async()=>{const room=$('roomInput').value.trim();if(!/^ks-[a-f0-9]{24}$/.test(room)){status('Invalid room code. Scan QR from laptop.','error');return}if(!navigator.mediaDevices?.getUserMedia){status('Microphone needs HTTPS and permission.','error');return}if(!window.Peer){status('PeerJS not loaded.','error');return}
 $('start').disabled=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});if(!stream.getAudioTracks().length)throw Error('iPhone gave no microphone audio track');localMeter(stream);peer=new Peer();status('Microphone ready. Talk to check the meter, then accept on laptop.');
 peer.on('open',()=>{call=peer.call(room,stream);if(!call){stopPhone();status('Connection failed.','error');return}status('Request sent. Press Accept mic on laptop.');$('stop').disabled=false;call.on('close',()=>{stopPhone();status('Connection closed.')});call.on('error',e=>{fail(e);stopPhone()})});
 peer.on('error',e=>{fail(e);stopPhone()})}catch(e){fail(e);stopPhone()}};
}
if(phone)mobile();else desktop();addEventListener('beforeunload',()=>{stopCall();if(stream)stream.getTracks().forEach(t=>t.stop());peer?.destroy()});
})();
</script></body></html>
